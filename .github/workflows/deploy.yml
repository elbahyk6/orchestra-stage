name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "pfe@example.com"
          git config --global user.name "PFE Deploy Bot"
          git remote add hf https://elbahy:$HF_TOKEN@huggingface.co/spaces/elbahy/orchestra-stage
          git push --force hf main